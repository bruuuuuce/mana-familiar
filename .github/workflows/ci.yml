name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  validate:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mana-familiar
    steps:
      - uses: actions/checkout@v4
        with:
          path: mana-familiar
      - uses: actions/checkout@v4
        with:
          repository: bruuuuuce/mana
          # Compatible M08 + C03 replanning and Activity paging producer; reproducible across both platforms.
          ref: 4469b5822c5c91228a53ad803eca835d8a9ff9bd
          path: mana
      - name: Verify M08 producer prerequisites
        run: python3 tool/check_mana_producer.py --mana-root ../mana
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Native performance failure evidence tests
        run: python3 tests/test_m08_native_performance_runner.py
      - name: Build M08 release performance harnesses
        run: |
          mkdir -p build/m08-performance
          dart compile exe tool/m08_performance_harness.dart -o build/m08-performance/harness
          dart compile exe tool/run_m08_performance_matrix.dart -o build/m08-performance/matrix
      - name: Run M08 medium PR performance budget
        run: |
          build/m08-performance/matrix \
            --mana-root ../mana \
            --harness build/m08-performance/harness \
            --output build/m08-performance/medium-report.json \
            --classes medium \
            --cold-runs 5 \
            --warm-runs 5
          M08_PERFORMANCE_REPORT=build/m08-performance/medium-report.json \
          M08_PERFORMANCE_CLASSES=medium \
            flutter test test/m08_performance_report_test.dart \
              --plain-name 'release performance matrix preserves C04 evidence and budgets'
      - name: Upload M08 medium performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m08-medium-performance
          path: mana-familiar/build/m08-performance/medium-report.json
          if-no-files-found: error
      - name: C03 Human Feedback producer smoke
        run: python3 tests/run-c03-human-feedback-harness.py --mana-root ../mana --profile smoke
      - name: Upload C03 Human Feedback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c03-human-feedback-smoke
          path: mana-familiar/build/feedback-audit
          if-no-files-found: warn
      - run: flutter build macos --debug

  validate-windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: mana-familiar
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          path: mana-familiar
      - uses: actions/checkout@v4
        with:
          repository: bruuuuuce/mana
          # Compatible M08 + C03 replanning and Activity paging producer; reproducible across both platforms.
          ref: 4469b5822c5c91228a53ad803eca835d8a9ff9bd
          path: mana
      - name: Verify M08 producer prerequisites
        run: python3 tool/check_mana_producer.py --mana-root ../mana
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Native performance failure evidence tests
        run: python3 tests/test_m08_native_performance_runner.py
      - run: flutter build windows --release
